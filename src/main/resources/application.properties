spring.application.name=RideSharingApp-Backend
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ridesharingapp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=jupiter
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Flyway Settings
spring.flyway.enabled=true
spring.flyway.url=jdbc:mysql://localhost:3306/ridesharingapp?serverTimezone=UTC
spring.flyway.user=root
spring.flyway.password=jupiter
spring.flyway.baseline-on-migrate=true
