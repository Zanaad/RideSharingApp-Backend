spring.application.name=RideSharingApp-Backend
# Database Configuration - If you want to try with docker compose just replace localhost:3306 to mysql:3306
spring.datasource.url=jdbc:mysql://localhost:3306/ridesharingapp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=jupiter
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair=true
#JWT
jwt.secret=mysupersecurekeythatshouldbeatleast64characterslong!